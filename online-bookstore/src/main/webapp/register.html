<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Page & Co.</title>
  <meta name="description" content="Page & Co. online bookstore">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
  <header id="site-header"></header>

  <main class="container">
    <div class="auth-wrap form-card">
      <h1>Create your account</h1>
      <div class="form-error" id="form-error" role="alert"></div>
      <form id="register-form" novalidate>
        <div class="field-group" data-field="fullName"><label for="fullName">Full name</label><input id="fullName" name="fullName" autocomplete="name" required><div class="err"></div></div>
        <div class="field-group" data-field="email"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><div class="err"></div></div>
        <div class="field-group" data-field="phone"><label for="phone">Phone number <span class="hint">(optional)</span></label><input id="phone" name="phone" type="tel" autocomplete="tel"><div class="err"></div></div>
        <div class="field-group" data-field="password"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required><div class="hint">At least 8 characters, with a letter and a number.</div><div class="err"></div></div>
        <div class="field-group" data-field="confirm"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required><div class="err"></div></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
      </form>
      <p style="margin:18px 0 0">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/app.js" defer></script>
</body>
</html>
