<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | Page & Co.</title>
  <meta name="description" content="Page & Co. online bookstore">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">
  <header id="site-header"></header>

  <main>
    <div class="page-head"><div class="container"><h1>Checkout</h1><p>Pay with cash when your order is delivered.</p></div></div>
    <div class="container" id="checkout-wrap">
      <div class="checkout-layout">
        <form class="form-card" id="checkout-form" novalidate>
          <h2>Delivery details</h2>
          <div class="form-error" id="form-error" role="alert"></div>
          <div class="form-grid">
            <div class="field-group full" data-field="fullName"><label for="fullName">Full name</label><input id="fullName" name="fullName" autocomplete="name" required><div class="err"></div></div>
            <div class="field-group" data-field="email"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><div class="err"></div></div>
            <div class="field-group" data-field="phone"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required><div class="err"></div></div>
            <div class="field-group full" data-field="address"><label for="address">Delivery address</label><textarea id="address" name="address" rows="3" autocomplete="street-address" required></textarea><div class="err"></div></div>
            <div class="field-group" data-field="city"><label for="city">City</label><input id="city" name="city" autocomplete="address-level2" required><div class="err"></div></div>
            <div class="field-group" data-field="pincode"><label for="pincode">Pincode</label><input id="pincode" name="pincode" inputmode="numeric" maxlength="6" autocomplete="postal-code" required><div class="err"></div></div>
          </div>
          <h3 style="margin-top:22px">Payment</h3>
          <label class="radio-box"><input type="radio" checked disabled> Cash on delivery</label>
        </form>
        <aside class="summary" aria-label="Order summary">
          <h2>Order summary</h2>
          <div id="co-lines"></div>
          <div class="summary-row total"><span>Total</span><span id="co-total"></span></div>
          <button class="btn btn-primary btn-block btn-lg" id="confirm-btn" type="submit" form="checkout-form">Confirm order</button>
          <a class="btn btn-outline btn-block" id="fix-cart" href="cart.html" hidden>Review your cart</a>
        </aside>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/app.js" defer></script>
  <script src="js/checkout.js" defer></script>
</body>
</html>
