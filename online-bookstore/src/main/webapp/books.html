<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books | Page & Co.</title>
  <meta name="description" content="Page & Co. online bookstore">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="books">
  <header id="site-header"></header>

  <main>
    <div class="page-head"><div class="container"><h1>All books</h1><p>Search by title or author, filter by category and sort by price.</p></div></div>
    <div class="container section">
      <form class="toolbar" id="filters" role="search">
        <div class="field grow"><label for="f-keyword">Search</label><input id="f-keyword" type="search" placeholder="Title or author" autocomplete="off"></div>
        <div class="field"><label for="f-category">Category</label><select id="f-category"><option value="">All categories</option></select></div>
        <div class="field"><label for="f-sort">Sort by</label>
          <select id="f-sort"><option value="">Featured order</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option></select></div>
        <span class="result-count" id="result-count" aria-live="polite"></span>
      </form>
      <div class="grid" id="book-grid"></div>
      <nav class="pagination" id="pagination" aria-label="Pagination"></nav>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/app.js" defer></script>
  <script src="js/books.js" defer></script>
</body>
</html>
